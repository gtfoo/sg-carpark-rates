name: Deploy to droplet

# Push to main -> SSH into the droplet, pull, rebuild, restart.
# Also runnable on demand from the Actions tab (e.g. after fixing a bad deploy).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys overlap; queue them instead of interrupting a build.
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  # Runs on GitHub's runners, not the droplet, so it costs the 1 vCPU box
  # nothing. The deploy waits on it: a rate-parser regression should never
  # reach production, and every case in tests/ is one that reached it once.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Must match the droplet's system Node (22.23.2). Testing on 20 while
          # shipping to 22 runs the gate on a different runtime than
          # production — and better-sqlite3's ABI differs across exactly that
          # boundary, which is the class of failure this gate exists to catch.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          # The droplet is 1 vCPU and hosts several apps; when another one is
          # building, a cold npm ci plus next build can exceed the action's
          # 10m default and the deploy dies mid-install.
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DROPLET_APP_DIR }}"
            git fetch --quiet origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
